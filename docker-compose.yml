services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: prism-arcadedb
    ports:
      - "2480:2480"   # HTTP / REST / Studio UI
      - "2424:2424"   # Binary protocol
    environment:
      ARCADEDB_SERVER_ROOTPASSWORD: prism-dev-secret
      JAVA_OPTS: >-
        -Darcadedb.server.defaultDatabases=prism[root:prism-dev-secret]
        -Darcadedb.server.plugins=GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2480/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: prism-kafka
    ports:
      - "9092:9092"   # External (host) access
    environment:
      # KRaft mode - no ZooKeeper
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Two listeners: EXTERNAL for host, INTERNAL for container-to-container
      KAFKA_CFG_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: prism-kafka-ui
    ports:
      - "8090:8080"   # Kafka UI at http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: prism-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: prism-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-prism}"
      POSTGRES_USER: "${POSTGRES_USER:-prism}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-prism-dev-secret}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prism} -d ${POSTGRES_DB:-prism}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-prism-dev-secret}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-prism-dev-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: prism-keycloak
    ports:
      - "8080:8080"   # Keycloak UI + API
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-prism-dev-secret}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-prism}"
      KC_DB_USERNAME: "${POSTGRES_USER:-prism}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-prism-dev-secret}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  prism-okta-agent:
    build:
      context: .
      dockerfile: packages/agents/Dockerfile
    profiles: ["dev-okta"]
    environment:
      OKTA_DOMAIN: "${OKTA_DOMAIN:-dev-placeholder.okta.com}"
      OKTA_API_TOKEN: "${OKTA_API_TOKEN:-placeholder}"
      OKTA_WEBHOOK_SECRET: "${OKTA_WEBHOOK_SECRET:-placeholder}"
      ARCADEDB_URL: "http://prism-arcadedb:2480"
      ARCADEDB_DB: "prism"
      ARCADEDB_USER: "root"
      ARCADEDB_PASS: "prism-dev-secret"
      KAFKA_BROKERS: "kafka:9094"
      PRISM_TENANT_ID: "prism-dev"
      SSD_ID: "okta-dev"
    depends_on:
      arcadedb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arcadedb-data:
  kafka-data:
  postgres-data:
  redis-data:
